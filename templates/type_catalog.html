{% extends "base.html" %}

{% block title %}72种人格图鉴 · 天赋类型学{% endblock %}

{% block content %}
{% include '_nav.html' %}

<!-- 页面标题区 -->
<section class="page-hero">
    <div class="section-content">
        <h1>72种人格图鉴</h1>
        <p>基于 Human 3.0 框架 · 4维天赋模型 · 72种独特人格类型</p>
    </div>
</section>

<!-- 主内容 -->
<section class="tile tile-light" style="padding-top: 32px; min-height: 60vh;">
    <div class="section-content">
        <!-- 大类型筛选（最显眼） -->
        <div class="catalog-type-tabs">
            <button class="type-tab active" data-type="">
                <span class="type-tab-icon">◈</span>
                <span class="type-tab-label">全部类型</span>
                <span class="type-tab-count">72</span>
            </button>
            <button class="type-tab type-tab-c" data-type="C">
                <span class="type-tab-icon">🧠</span>
                <span class="type-tab-label">认知洞察型</span>
                <span class="type-tab-count">18</span>
            </button>
            <button class="type-tab type-tab-r" data-type="R">
                <span class="type-tab-icon">💚</span>
                <span class="type-tab-label">关系创造型</span>
                <span class="type-tab-count">18</span>
            </button>
            <button class="type-tab type-tab-b" data-type="B">
                <span class="type-tab-icon">⚡</span>
                <span class="type-tab-label">身体实践型</span>
                <span class="type-tab-count">18</span>
            </button>
            <button class="type-tab type-tab-s" data-type="S">
                <span class="type-tab-icon">👑</span>
                <span class="type-tab-label">系统引领型</span>
                <span class="type-tab-count">18</span>
            </button>
        </div>

        <!-- 搜索框 -->
        <div class="catalog-search">
            <div class="search-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--body-muted); flex-shrink: 0;">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索类型代码或名称（如 CDAM、深渊哲学家）" autocomplete="off">
            </div>
            <button class="btn-link" id="btnResetFilter" style="display:none;">重置筛选</button>
        </div>

        <!-- 按大类型分组显示 -->
        <div id="catalogGroups">
            <!-- 动态生成分组 -->
        </div>

        <!-- 空状态 -->
        <div class="catalog-empty" id="catalogEmpty" style="display:none;">
            <div style="font-size: 40px; margin-bottom: 12px; color: var(--body-muted);">🔍</div>
            <p>没有找到匹配的类型</p>
            <p style="font-size: 0.85rem; color: var(--body-muted); margin-top: 8px;">试试其他筛选条件</p>
        </div>
    </div>
</section>

<!-- 详情弹窗 -->
<div class="dict-modal" id="detailModal" style="display:none;">
    <div class="dict-modal-overlay" onclick="closeDetailModal()"></div>
    <div class="dict-modal-content" style="max-width: 700px;">
        <button class="dict-modal-close" onclick="closeDetailModal()">✕</button>
        <div class="dict-modal-body" id="detailModalBody">
            <!-- 动态生成 -->
        </div>
    </div>
</div>

{% include '_footer.html' %}
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/type_catalog.js') }}"></script>
{% endblock %}
